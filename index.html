<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

:root {
  --yellow: #ffd629;
  --ink: #191919;
  --gray: #f7f7f7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--ink);
}

header {
  background: var(--yellow);
  padding: 20px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 5px;
}

.tag {
  font-size: 11px;
  letter-spacing: 2px;
}

button {
  font: inherit;
  cursor: pointer;
}

.cart-btn,
.dark-btn {
  background: var(--ink);
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 13px 17px;
  font-weight: 700;
}

.hero {
  padding: 48px 5%;
  background: #fff9dc;
}

.hero h1 {
  font-size: clamp(32px, 5vw, 56px);
  max-width: 670px;
  margin: 10px 0;
}

.hero p {
  line-height: 1.6;
  max-width: 590px;
}

.yellow-btn {
  background: var(--yellow);
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  font-weight: bold;
}

main {
  padding: 28px 5%;
  max-width: 1400px;
  margin: auto;
}

.categories {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin: 18px 0 25px;
}

.categories button {
  border: 1px solid #ddd;
  background: white;
  padding: 11px 15px;
  border-radius: 30px;
}

.categories button.active {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px;
}

.card {
  border: 1px solid #eee;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 20px #00000008;
}

.art {
  aspect-ratio: 1;
  background: #f8f4e8;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.content {
  padding: 15px;
}

.muted {
  color: #686868;
  font-size: 13px;
  line-height: 1.5;
}

.content h3 {
  margin: 7px 0;
}
